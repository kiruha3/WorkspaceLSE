<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2300" viewBox="0 0 900 2300" role="img" aria-labelledby="title desc"><title id="title">Комплекты и выдача</title><desc id="desc">Фактическая структура локальной базы. Все внешние ключи таблиц данного модуля. PK первичный ключ, FK внешний ключ, UNIQUE уникальность. Справа таблица-родитель. Ограничение на одну открытую приостановку не означает связь один к одному для всей истории.</desc><style>:root{color-scheme:light dark;--ink:light-dark(#17392f,#e8f3ed);--muted:light-dark(#4c665d,#b5c9bf);--paper:light-dark(#ffffff,#15231d);--surface:light-dark(#f5f8f4,#20372b);--line:light-dark(#cad8cf,#526e5d)}text{font-family:'Segoe UI',sans-serif;fill:var(--ink);font-size:14px}.title{font-size:22px;font-weight:600}.tableName{font-weight:600}.hint{fill:var(--muted);font-size:12px}.table{fill:var(--paper);stroke:var(--line)}.parent{fill:var(--surface);stroke:var(--line)}.edge{stroke:var(--muted);stroke-width:1;fill:none}.relation{font-weight:600}.target{font-size:13px}</style><rect width="900" height="2300" fill="var(--paper)"/><text id="heading" class="title" x="12" y="30">Комплекты и выдача</text><text class="hint" x="12" y="53">Локальная PostgreSQL · метаданные на 28.10.2026 · 7 таблиц, 25 внешних ключей</text><text class="hint" x="12" y="76">Слева — дочерняя таблица и её ключи. Справа — таблица, на которую ссылается поле FK.</text><text class="hint" x="12" y="98">1:N читается от родителя к дочерней таблице. N:M реализуется через таблицу с двумя FK.</text><g><rect class="table" x="12" y="126" width="396" height="334" rx="7"/><text class="tableName" x="26" y="151">issuance_checkfile</text><text class="hint" x="26" y="171">issuance.CheckFile</text><text class="column" x="26" y="202">id</text><text class="hint" x="26" y="219">PK</text><text class="column" x="26" y="246">accepted_version_id</text><text class="hint" x="26" y="263">FK · NULL разрешён</text><path class="edge" d="M 408 244 H 553"/><text class="relation" text-