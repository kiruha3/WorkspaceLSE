<svg xmlns="http://www.w3.org/2000/svg" width="900" height="633" viewBox="0 0 900 633" role="img" aria-labelledby="title desc"><title id="title">Документы и версии файлов</title><desc id="desc">Фактическая структура локальной базы. Все внешние ключи таблиц данного модуля. PK первичный ключ, FK внешний ключ, UNIQUE уникальность. Справа таблица-родитель. Ограничение на одну открытую приостановку не означает связь один к одному для всей истории.</desc><style>:root{color-scheme:light dark;--ink:light-dark(#17392f,#e8f3ed);--muted:light-dark(#4c665d,#b5c9bf);--paper:light-dark(#ffffff,#15231d);--surface:light-dark(#f5f8f4,#20372b);--line:light-dark(#cad8cf,#526e5d)}text{font-family:'Segoe UI',sans-serif;fill:var(--ink);font-size:14px}.title{font-size:22px;font-weight:600}.tableName{font-weight:600}.hint{fill:var(--muted);font-size:12px}.table{fill:var(--paper);stroke:var(--line)}.parent{fill:var(--surface);stroke:var(--line)}.edge{stroke:var(--muted);stroke-width:1;fill:none}.relation{font-weight:600}.target{font-size:13px}</style><rect width="900" height="633" fill="var(--paper)"/><text id="heading" class="title" x="12" y="30">Документы и версии файлов</text><text class="hint" x="12" y="53">Локальная PostgreSQL · метаданные на 28.10.2026 · 2 таблиц, 4 внешних ключей</text><text class="hint" x="12" y="76">Слева — дочерняя таблица и её ключи. Справа — таблица, на которую ссылается поле FK.</text><text class="hint" x="12" y="98">1:N читается от родителя к дочерней таблице. N:M реализуется через таблицу с двумя FK.</text><g><rect class="table" x="12" y="126" width="396" height="202" rx="7"/><text class="tableName" x="26" y="151">documents_document</text><text class="hint" x="26" y="171">documents.Document</text><text class="column" x="26" y="202">id</text><text class="hint" x="26" y="219">PK</text><text class="column" x="26" y="246">created_by_id</text><text class="hint" x="26" y="263">FK</text><path class="edge" d="M 408 244 H 553"/><text class="relation" text-anchor="middle" x="479" y="236">1:N</text><text class="hint" text-anchor="middle" x="479" y="262">0..N ↔ 1</text><rect class="parent" x="553" y="225" width="335" height="44" rx="5"/><text class="target" x="565" y="244">personnel_employee</text><text class="hint" x="565" y="261">id · родитель</text><text class="column" x="26" y="290">department_id</text><text class="hint" x="26" y="307">FK · NULL разрешён</text><path class="edge" d="M 408 288 H 553"/><text class="relation" text-anchor="middle" x="479" y="280">1:N</text><text class="hint" text-anchor="middle" x="479" y="306">0..N ↔ 0..1</text><rect class="parent" x="553" y="269" width="335" height="44" rx="5"/><text class="target" x="565" y="288">references_department</text><text class="hint" x="565" y="305">id · родитель</text></g><g><rect class="table" x="12" y="358" width="396" height="225" rx="7"/><text class="tableName" x="26" y="383">documents_fileversion</text><text class="hint" x="26" y="403">documents.FileVersion</text><text class="column" x="26" y="434">id</text><text class="hint" x="26" y="451">PK</text><text class="column" x="26" y="478">created_by_id</text><text class="hint" x="26" y="495">FK</text><path class="edge" d="M 408 476 H 553"/><text class="relation" text-anchor="middle" x="479" y="468">1:N</text><text class="hint" text-anchor="middle" x="479" y="494">0..N ↔ 1</text><rect class="parent" x="553" y="457" width="335" height="44" rx="5"/><text class="target" x="565" y="476">personnel_employee</text><text class="hint" x="565" y="493">id · родитель</text><text class="column" x="26" y="522">document_id</text><text class="hint" x="26" y="539">FK</text><path class="edge" d="M 408 520 H 553"/><text class="relation" text-anchor="middle" x="479" y="512">1:N</text><text class="hint" text-anchor="middle" x="479" y="538">0..N ↔ 1</text><rect class="parent" x="553" y="501" width="335" height="44" rx="5"/><text class="target" x="565" y="520">documents_document</text><text class="hint" x="565" y="537">id · родитель</text><text class="hint" x="26" y="566">UNIQUE (document_id, number)</text></g></svg>
