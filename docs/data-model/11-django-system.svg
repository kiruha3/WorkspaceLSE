<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1211" viewBox="0 0 900 1211" role="img" aria-labelledby="title desc"><title id="title">Служебные таблицы Django</title><desc id="desc">Фактическая структура локальной базы. Все внешние ключи таблиц данного модуля. PK первичный ключ, FK внешний ключ, UNIQUE уникальность. Справа таблица-родитель. Ограничение на одну открытую приостановку не означает связь один к одному для всей истории.</desc><style>:root{color-scheme:light dark;--ink:light-dark(#17392f,#e8f3ed);--muted:light-dark(#4c665d,#b5c9bf);--paper:light-dark(#ffffff,#15231d);--surface:light-dark(#f5f8f4,#20372b);--line:light-dark(#cad8cf,#526e5d)}text{font-family:'Segoe UI',sans-serif;fill:var(--ink);font-size:14px}.title{font-size:22px;font-weight:600}.tableName{font-weight:600}.hint{fill:var(--muted);font-size:12px}.table{fill:var(--paper);stroke:var(--line)}.parent{fill:var(--surface);stroke:var(--line)}.edge{stroke:var(--muted);stroke-width:1;fill:none}.relation{font-weight:600}.target{font-size:13px}</style><rect width="900" height="1211" fill="var(--paper)"/><text id="heading" class="title" x="12" y="30">Служебные таблицы Django</text><text class="hint" x="12" y="53">Локальная PostgreSQL · метаданные на 28.10.2026 · 6 таблиц, 3 внешних ключей</text><text class="hint" x="12" y="76">Слева — дочерняя таблица и её ключи. Справа — таблица, на которую ссылается поле FK.</text><text class="hint" x="12" y="98">1:N читается от родителя к дочерней таблице. N:M реализуется через таблицу с двумя FK.</text><g><rect class="table" x="12" y="126" width="396" height="114" rx="7"/><text class="tableName" x="26" y="151">auth_group</text><text class="hint" x="26" y="171">auth.Group</text><text class="column" x="26" y="202">id</text><text class="hint" x="26" y="219">PK</text></g><g><rect class="table" x="12" y="270" width="396" height="225" rx="7"/><text class="tableName" x="26" y="295">auth_group_permissions</text><text class="hint" x="26" y="315">Связующая таблица N:M</text><text class="column" x="26" y="346">id</text><text class="hint" x="26" y="363">PK</text><text class="column" x="26" y="390">group_id</text><text class="hint" x="26" y="407">FK</text><path class="edge" d="M 408 388 H 553"/><text class="relation" text-anchor="middle" x="479" y="380">1:N</text><text class="hint" text-anchor="middle" x="479" y="406">0..N ↔ 1</text><rect class="parent" x="553" y="369" width="335" height="44" rx="5"/><text class="target" x="565" y="388">auth_group</text><text class="hint" x="565" y="405">id · родитель</text><text class="column" x="26" y="434">permission_id</text><text class="hint" x="26" y="451">FK</text><path class="edge" d="M 408 432 H 553"/><text class="relation" text-anchor="middle" x="479" y="424">1:N</text><text class="hint" text-anchor="middle" x="479" y="450">0..N ↔ 1</text><rect class="parent" x="553" y="413" width="335" height="44" rx="5"/><text class="target" x="565" y="432">auth_permission</text><text class="hint" x="565" y="449">id · родитель</text><text class="hint" x="26" y="478">UNIQUE (group_id, permission_id)</text></g><g><rect class="table" x="12" y="525" width="396" height="181" rx="7"/><text class="tableName" x="26" y="550">auth_permission</text><text class="hint" x="26" y="570">auth.Permission</text><text class="column" x="26" y="601">id</text><text class="hint" x="26" y="618">PK</text><text class="column" x="26" y="645">content_type_id</text><text class="hint" x="26" y="662">FK</text><path class="edge" d="M 408 643 H 553"/><text class="relation" text-anchor="middle" x="479" y="635">1:N</text><text class="hint" text-anchor="middle" x="479" y="661">0..N ↔ 1</text><rect class="parent" x="553" y="624" width="335" height="44" rx="5"/><text class="target" x="565" y="643">django_content_type</text><text class="hint" x="565" y="660">id · родитель</text><text class="hint" x="26" y="689">UNIQUE (content_type_id, codename)</text></g><g><rect class="table" x="12" y="736" width="396" height="137" rx="7"/><text class="tableName" x="26" y="761">django_content_type</text><text class="hint" x="26" y="781">contenttypes.ContentType</text><text class="column" x="26" y="812">id</text><text class="hint" x="26" y="829">PK</text><text class="hint" x="26" y="856">UNIQUE (app_label, model)</text></g><g><rect class="table" x="12" y="903" width="396" height="114" rx="7"/><text class="tableName" x="26" y="928">django_migrations</text><text class="hint" x="26" y="948">Служебная таблица</text><text class="column" x="26" y="979">id</text><text class="hint" x="26" y="996">PK</text></g><g><rect class="table" x="12" y="1047" width="396" height="114" rx="7"/><text class="tableName" x="26" y="1072">django_session</text><text class="hint" x="26" y="1092">sessions.Session</text><text class="column" x="26" y="1123">session_key</text><text class="hint" x="26" y="1140">PK</text></g></svg>
