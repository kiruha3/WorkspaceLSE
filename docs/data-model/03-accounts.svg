<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1366" viewBox="0 0 900 1366" role="img" aria-labelledby="title desc"><title id="title">Учётные записи и роли</title><desc id="desc">Фактическая структура локальной базы. Все внешние ключи таблиц данного модуля. PK первичный ключ, FK внешний ключ, UNIQUE уникальность. Справа таблица-родитель. Ограничение на одну открытую приостановку не означает связь один к одному для всей истории.</desc><style>:root{color-scheme:light dark;--ink:light-dark(#17392f,#e8f3ed);--muted:light-dark(#4c665d,#b5c9bf);--paper:light-dark(#ffffff,#15231d);--surface:light-dark(#f5f8f4,#20372b);--line:light-dark(#cad8cf,#526e5d)}text{font-family:'Segoe UI',sans-serif;fill:var(--ink);font-size:14px}.title{font-size:22px;font-weight:600}.tableName{font-weight:600}.hint{fill:var(--muted);font-size:12px}.table{fill:var(--paper);stroke:var(--line)}.parent{fill:var(--surface);stroke:var(--line)}.edge{stroke:var(--muted);stroke-width:1;fill:none}.relation{font-weight:600}.target{font-size:13px}</style><rect width="900" height="1366" fill="var(--paper)"/><text id="heading" class="title" x="12" y="30">Учётные записи и роли</text><text class="hint" x="12" y="53">Локальная PostgreSQL · метаданные на 28.10.2026 · 6 таблиц, 6 внешних ключей</text><text class="hint" x="12" y="76">Слева — дочерняя таблица и её ключи. Справа — таблица, на которую ссылается поле FK.</text><text class="hint" x="12" y="98">1:N читается от родителя к дочерней таблице. N:M реализуется через таблицу с двумя FK.</text><g><rect class="table" x="12" y="126" width="396" height="181" rx="7"/><text class="tableName" x="26" y="151">accounts_commandreceipt</text><text class="hint" x="26" y="171">accounts.CommandReceipt</text><text class="column" x="26" y="202">id</text><text class="hint" x="26" y="219">PK</text><text class="column" x="26" y="246">actor_id</text><text class="hint" x="26" y="263">FK</text><path class="edge" d="M 408 244 H 553"/><text class="relation" text-anchor="middle" x="479" y="236">1:N</text><text class="hint" text-anchor="middle" x="479" y="262">0..N ↔ 1</text><rect class="parent" x="553" y="225" width="335" height="44" rx="5"/><text class="target" x="565" y="244">accounts_user</text><text class="hint" x="565" y="261">id · родитель</text><text class="hint" x="26" y="290">UNIQUE (actor_id, action, key)</text></g><g><rect class="table" x="12" y="337" width="396" height="114" rx="7"/><text class="tableName" x="26" y="362">accounts_role</text><text class="hint" x="26" y="382">accounts.Role</text><text class="column" x="26" y="413">id</text><text class="hint" x="26" y="430">PK</text></g><g><rect class="table" x="12" y="481" width="396" height="181" rx="7"/><text class="tableName" x="26" y="506">accounts_rolepermission</text><text class="hint" x="26" y="526">accounts.RolePermission</text><text class="column" x="26" y="557">id</text><text class="hint" x="26" y="574">PK</text><text class="column" x="26" y="601">role_id</text><text class="hint" x="26" y="618">FK</text><path class="edge" d="M 408 599 H 553"/><text class="relation" text-anchor="middle" x="479" y="591">1:N</text><text class="hint" text-anchor="middle" x="479" y="617">0..N ↔ 1</text><rect class="parent" x="553" y="580" width="335" height="44" rx="5"/><text class="target" x="565" y="599">accounts_role</text><text class="hint" x="565" y="616">id · родитель</text><text class="hint" x="26" y="645">UNIQUE (role_id, permission_code)</text></g><g><rect class="table" x="12" y="692" width="396" height="114" rx="7"/><text class="tableName" x="26" y="717">accounts_user</text><text class="hint" x="26" y="737">accounts.User</text><text class="column" x="26" y="768">id</text><text class="hint" x="26" y="785">PK</text></g><g><rect class="table" x="12" y="836" width="396" height="225" rx="7"/><text class="tableName" x="26" y="861">accounts_user_groups</text><text class="hint" x="26" y="881">Связующая таблица N:M</text><text class="column" x="26" y="912">id</text><text class="hint" x="26" y="929">PK</text><text class="column" x="26" y="956">user_id</text><text class="hint" x="26" y="973">FK</text><path class="edge" d="M 408 954 H 553"/><text class="relation" text-anchor="middle" x="479" y="946">1:N</text><text class="hint" text-anchor="middle" x="479" y="972">0..N ↔ 1</text><rect class="parent" x="553" y="935" width="335" height="44" rx="5"/><text class="target" x="565" y="954">accounts_user</text><text class="hint" x="565" y="971">id · родитель</text><text class="column" x="26" y="1000">group_id</text><text class="hint" x="26" y="1017">FK</text><path class="edge" d="M 408 998 H 553"/><text class="relation" text-anchor="middle" x="479" y="990">1:N</text><text class="hint" text-anchor="middle" x="479" y="1016">0..N ↔ 1</text><rect class="parent" x="553" y="979" width="335" height="44" rx="5"/><text class="target" x="565" y="998">auth_group</text><text class="hint" x="565" y="1015">id · родитель</text><text class="hint" x="26" y="1044">UNIQUE (user_id, group_id)</text></g><g><rect class="table" x="12" y="1091" width="396" height="225" rx="7"/><text class="tableName" x="26" y="1116">accounts_user_user_permissions</text><text class="hint" x="26" y="1136">Связующая таблица N:M</text><text class="column" x="26" y="1167">id</text><text class="hint" x="26" y="1184">PK</text><text class="column" x="26" y="1211">user_id</text><text class="hint" x="26" y="1228">FK</text><path class="edge" d="M 408 1209 H 553"/><text class="relation" text-anchor="middle" x="479" y="1201">1:N</text><text class="hint" text-anchor="middle" x="479" y="1227">0..N ↔ 1</text><rect class="parent" x="553" y="1190" width="335" height="44" rx="5"/><text class="target" x="565" y="1209">accounts_user</text><text class="hint" x="565" y="1226">id · родитель</text><text class="column" x="26" y="1255">permission_id</text><text class="hint" x="26" y="1272">FK</text><path class="edge" d="M 408 1253 H 553"/><text class="relation" text-anchor="middle" x="479" y="1245">1:N</text><text class="hint" text-anchor="middle" x="479" y="1271">0..N ↔ 1</text><rect class="parent" x="553" y="1234" width="335" height="44" rx="5"/><text class="target" x="565" y="1253">auth_permission</text><text class="hint" x="565" y="1270">id · родитель</text><text class="hint" x="26" y="1299">UNIQUE (user_id, permission_id)</text></g></svg>
