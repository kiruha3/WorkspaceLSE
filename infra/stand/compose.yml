name: ais-lse-stand
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ais_lse_stand
      POSTGRES_USER: ais_lse_stand
      POSTGRES_PASSWORD: ${PGPASSWORD:?Run init_env.py first}
    volumes:
      - stand_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais_lse_stand -d ais_lse_stand"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ../..
      dockerfile: infra/stand/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.stand_settings
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ais_lse_stand
      PGUSER: ais_lse_stand
      PYTHONUTF8: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - stand_media:/app/media
      - stand_static:/app/staticfiles
      - ../../.stand-access:/access
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/auth/csrf/',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: ../..
      dockerfile: infra/stand/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${AIS_HTTP_PORT:-8088}:80"
    volumes:
      - stand_static:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
volumes:
  stand_database:
  stand_media:
  stand_static:
